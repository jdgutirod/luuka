server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Files with a hash in their name never change: cache them for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single page app: routes like /login or /group-charges/123 are resolved by React Router
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
